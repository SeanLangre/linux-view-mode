# CouchTube owns this configuration, independent of the user's desktop mpv.
# Skip AV1 first: its streams hit "Invalid OBU length" demux corruption; fall back to it only if nothing else exists.
ytdl-format=bv*[height<=1080][vcodec!^=av01]+ba/b[height<=1080][vcodec!^=av01]/bv*[height<=1080]+ba/b[height<=1080]
hwdec=vaapi
osd-font-size=36
osd-duration=2500
