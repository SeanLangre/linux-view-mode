# CouchTube owns this configuration, independent of the user's desktop mpv.
# Skip AV1 first: its streams hit "Invalid OBU length" demux corruption; fall back to it only if nothing else exists.
# YouTube's direct (https) streams from the TV client often answer 403 now (2026-11-01), so try HLS first;
# it plays the same videos and falls back to the direct formats if no HLS stream exists.
ytdl-format=bv*[height<=1080][vcodec!^=av01][protocol^=m3u8]+ba[protocol^=m3u8]/b[height<=1080][protocol^=m3u8]/bv*[height<=1080][vcodec!^=av01]+ba/b[height<=1080][vcodec!^=av01]/bv*[height<=1080]+ba/b[height<=1080]
hwdec=vaapi
osd-font-size=36
osd-duration=2500
