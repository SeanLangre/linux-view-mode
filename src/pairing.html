<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CouchTube sign-in</title>
<style>
  body { font: 18px system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  label { display: block; margin-top: 12px; }
  input { width: 100%; box-sizing: border-box; font-size: 20px; padding: 12px; margin: 4px 0 8px; }
  button { font-size: 18px; padding: 12px 16px; margin: 4px 4px 4px 0; }
  fieldset { border: 1px solid #444; margin: 16px 0; padding: 8px 12px 12px; }
  #msg { min-height: 1.5em; color: #f99; }
</style>
<h1>Sign in on the TV</h1>
<p>Do each step when the TV shows the matching page. If you mistype, you can send a step up to 3 times; after that use the TV keyboard.</p>
<p id="msg" role="status"></p>

<form id="email-form" class="step" data-step="email">
  <fieldset>
    <legend>1. Email</legend>
    <p>The TV must be showing Google's email field.</p>
    <label for="email">Email</label>
    <input id="email" name="username" type="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit">Type email on the TV</button>
  </fieldset>
</form>

<form id="password-form" class="step" data-step="password">
  <fieldset>
    <legend>2. Password</legend>
    <p>Wait until the TV shows the password page.</p>
    <label for="pass">Password</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Password page is showing, type it</button>
  </fieldset>
</form>

<form id="code-form" class="step" data-step="code">
  <fieldset>
    <legend>3. 2-step code (only if asked)</legend>
    <label for="code">Verification code</label>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required>
    <button type="submit">Type code on the TV</button>
  </fieldset>
</form>
<script>
  const msg = document.getElementById('msg')
  const say = (text, ok) => { msg.style.color = ok ? '#9f9' : '#f99'; msg.textContent = text }
  for (const form of document.querySelectorAll('.step')) {
    const input = form.querySelector('input'), button = form.querySelector('button')
    input.setAttribute('aria-describedby', 'msg')
    form.onsubmit = async (e) => {
      e.preventDefault()
      button.disabled = true
      msg.style.color = '#9cf'; msg.textContent = 'Typing on the TV…'
      try {
        const res = await fetch(location.pathname + '/' + form.dataset.step, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: input.value }),
        })
        if (res.ok) {
          input.value = ''
          button.disabled = false
          say('Sent step ' + form.dataset.step + '. Check the TV.', true)
        } else {
          button.disabled = res.status === 409
          say((await res.json().catch(() => null))?.error ?? 'failed', false)
        }
      } catch {
        button.disabled = false
        say("Couldn't reach the TV. Are you on the same Wi-Fi?", false)
      }
    }
  }
</script>
