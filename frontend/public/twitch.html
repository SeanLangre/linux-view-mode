<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CouchTube Twitch player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; color: #fff; font-family: system-ui, sans-serif; }
  /* The page, not the embedded player, keeps keyboard focus so the same keys work as on YouTube. */
  #player iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  /* Chat (T): a read-only pane on the right; the video narrows to make room. */
  #chat { position: fixed; top: 0; right: 0; width: 25%; height: 100%; border: 0; display: none; pointer-events: none; background: #18181b; }
  body.chat #chat { display: block; }
  /* A broadcast has no chat embed: its replay is drawn here, in step with the video. */
  #chatlog { position: fixed; top: 0; right: 0; width: 25%; height: 100%; box-sizing: border-box; padding: 0.6rem 0.8rem; display: none;
    flex-direction: column; justify-content: flex-end; overflow: hidden; background: #18181b; font-size: 1.15rem; line-height: 1.35; pointer-events: none; }
  body.chat #chatlog { display: flex; }
  #chatlog p { margin: 0 0 0.35rem; overflow-wrap: anywhere; }
  #chatlog b { font-weight: 700; }
  #chatlog .none { color: #9a9aa5; }
  body.chat #player iframe { width: 75%; }
  #osd { position: fixed; left: 2rem; top: 2rem; max-width: 70vw; padding: 0.6rem 1rem; border-radius: 0.5rem;
    background: rgb(0 0 0 / 0.8); font-size: 2rem; white-space: pre-line; opacity: 0; transition: opacity 0.2s; z-index: 3; }
  #osd.on { opacity: 1; }
  #live { display: inline-block; margin-right: 0.6rem; padding: 0 0.5rem; border-radius: 0.3rem; background: #9146ff; font-size: 1.4rem; font-weight: 700; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; font-size: 2.2rem; z-index: 1; pointer-events: none; }
  #wait.off { display: none; }
</style>
</head>
<body tabindex="0">
<div id="player"></div>
<div id="wait">Connecting to Twitch…</div>
<iframe id="chat" title="Twitch chat"></iframe>
<div id="chatlog"></div>
<div id="osd"></div>
<script>
// Plays one live Twitch channel, past broadcast (VOD) or clip in Twitch's embedded player and
// mirrors what the YouTube page does: the backend gets position, pause state and "playing" from
// here, and sends back the same commands the phone remote and keyboard use. Live streams have no
// seeking; broadcasts seek and report their position (the backend saves it for resuming); a clip
// plays in Twitch's clip embed, which has no scripting API, so it only starts and can be stopped.
// Chat (T, or the phone's Chat button) shows Twitch's read-only chat embed beside a live stream.
// Subtitles and the queue do not exist here.
const params = new URLSearchParams(location.search)
const channel = /^[A-Za-z0-9_]{1,25}$/.test(params.get('c') || '') ? params.get('c') : ''
const video = /^[0-9]{1,20}$/.test(params.get('v') || '') ? params.get('v') : ''
const clip = /^[A-Za-z0-9_-]{1,100}$/.test(params.get('clip') || '') ? params.get('clip') : ''
const startAt = Math.max(0, Math.floor(Number(params.get('t')) || 0))
const session = Number(params.get('s'))
const kind = video ? 'vod' : clip ? 'clip' : 'live'
const label = video ? 'Broadcast' : clip ? 'Clip' : channel

// What the backend is told when the page gives up (see `twitch_error` in src/player.rs).
const OFFLINE = -4
const SCRIPT_FAILED = -1

let player = null
let ready = false
let playing = false
let finished = false
let osdTimer = 0
let failures = 0

function show(text, ms = 2500, live = false) {
  const osd = document.getElementById('osd')
  osd.replaceChildren()
  if (live) {
    const badge = document.createElement('span')
    badge.id = 'live'
    badge.textContent = 'LIVE'
    osd.appendChild(badge)
  }
  osd.appendChild(document.createTextNode(text))
  osd.classList.add('on')
  clearTimeout(osdTimer)
  osdTimer = setTimeout(() => osd.classList.remove('on'), ms)
}

function snapshot() {
  // A clip has no player API: once its frame loaded, say it started (position 0) and nothing more.
  if (kind === 'clip') return { position: playing ? 0 : undefined, title: label }
  if (!ready) return {}
  const seconds = playing ? Number(player.getCurrentTime()) : NaN
  const length = kind === 'vod' && playing ? Number(player.getDuration()) : NaN
  return {
    duration: Number.isFinite(length) && length > 0 ? length : undefined,
    // The backend treats the first position as "the stream started", so only send one once playing.
    position: Number.isFinite(seconds) && seconds >= 0 ? seconds : playing ? 0 : undefined,
    paused: player.isPaused(),
    title: label,
  }
}

async function report(extra = {}) {
  try {
    const res = await fetch('/api/player/report', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session, ...snapshot(), ...extra }),
    })
    if (!res.ok) throw new Error(String(res.status))
    failures = 0
    const body = await res.json()
    for (const command of body.commands || []) run(command)
  } catch {
    // The backend is gone or restarting; it closes this window itself.
    failures += 1
  }
}

function finish(outcome, extra = {}) {
  if (finished) return
  finished = true
  void report({ outcome, ...extra })
}

// The commands are mpv's, as sent by the remote: ["cycle","pause"], ["seek",10], ["add","volume",2].
// Subtitles do not exist here, and seeking only for a broadcast.
function run(command) {
  if (!ready || !Array.isArray(command)) return
  const [name, a, b] = command
  if (name === 'cycle' && a === 'chat') toggleChat()
  else if (name === 'seek' && typeof a === 'number') {
    if (kind !== 'vod' || !playing) return
    const length = Number(player.getDuration())
    const target = Math.max(0, Number(player.getCurrentTime()) + a)
    player.seek(Number.isFinite(length) && length > 0 ? Math.min(target, Math.max(0, length - 1)) : target)
    show(`${a > 0 ? '+' : '−'}${Math.abs(a)} s · ${clock(target)}`, 1500)
  } else if (name === 'cycle' && a === 'pause') togglePause()
  else if (name === 'cycle' && a === 'mute') {
    const muted = !player.getMuted()
    player.setMuted(muted)
    show(muted ? 'Muted' : 'Mute off', 1200)
  } else if (name === 'add' && a === 'volume' && typeof b === 'number') {
    // mpv's volume is 0-100; Twitch's is 0-1.
    const volume = Math.min(1, Math.max(0, player.getVolume() + b / 100))
    player.setVolume(volume)
    if (volume > 0 && player.getMuted()) player.setMuted(false)
    show(`Volume ${Math.round(volume * 100)}`, 1200)
  }
}

function clock(seconds) {
  const total = Math.max(0, Math.floor(seconds))
  const h = Math.floor(total / 3600)
  const m = String(Math.floor((total % 3600) / 60)).padStart(h ? 2 : 1, '0')
  const sec = String(total % 60).padStart(2, '0')
  return h ? `${h}:${m}:${sec}` : `${m}:${sec}`
}

// Chat replay of a broadcast: the backend hands out Twitch's stored batches (about 60 lines around a
// moment); the page keeps the ones it has and shows the last lines that happened before the current time.
let replay = []          // {at, name, color, text}, sorted by `at`
let replayFrom = 0       // the span of the broadcast the buffer is known to cover: [replayFrom, replayTo)
let replayTo = 0
let replayBusy = false
const SHOWN = 40

async function loadReplay(from) {
  replayBusy = true
  try {
    const res = await fetch(`/api/twitch/chat/${video}?t=${Math.floor(from)}`)
    if (!res.ok) throw new Error(String(res.status))
    const batch = await res.json()
    const lines = batch.items
    const last = lines.length ? lines[lines.length - 1].at : from
    if (from < replayFrom || from > replayTo || !replay.length) { replay = []; replayFrom = from }
    const known = new Set(replay.map((m) => `${m.at}|${m.name}|${m.text}`))
    for (const m of lines) if (!known.has(`${m.at}|${m.name}|${m.text}`)) replay.push(m)
    replay.sort((a, b) => a.at - b.at)
    replayFrom = Math.min(replayFrom, lines.length ? lines[0].at : from)
    // More chat after this batch: it is known up to its last line; with none, a quiet stretch.
    replayTo = batch.more ? Math.max(replayTo, last + 1) : Math.max(replayTo, from + 60)
    if (!lines.length) replayTo = Math.max(replayTo, from + 30)
  } catch { /* the next tick tries again */ }
  replayBusy = false
}

function renderReplay(now) {
  const box = document.getElementById('chatlog')
  const lines = replay.filter((m) => m.at <= now).slice(-SHOWN)
  box.replaceChildren(...(lines.length ? lines.map((m) => {
    const row = document.createElement('p')
    const who = document.createElement('b')
    who.textContent = m.name
    if (m.color) who.style.color = m.color
    row.append(who, document.createTextNode(`: ${m.text}`))
    return row
  }) : [Object.assign(document.createElement('p'), { className: 'none', textContent: 'No chat yet at this point.' })]))
}

function tickReplay() {
  if (kind !== 'vod' || !document.body.classList.contains('chat') || !playing || replayBusy) return
  const now = Number(player.getCurrentTime())
  if (!Number.isFinite(now)) return
  // Fetch when the current moment is outside what the buffer covers (a seek, or the end of the batch).
  if (now < replayFrom || now >= replayTo) void loadReplay(now)
  renderReplay(now)
}

// Chat is read-only and off by default. A live channel gets Twitch's chat embed; a broadcast gets its replay.
function toggleChat() {
  if (kind === 'clip') { show('Clips have no chat', 2500); return }
  const frame = document.getElementById('chat')
  const on = !document.body.classList.contains('chat')
  if (kind === 'vod') { document.body.classList.toggle('chat', on); show(on ? 'Chat on' : 'Chat off', 1200); if (on) tickReplay(); return }
  // The frame is only loaded the first time it is wanted.
  if (on && !frame.src) frame.src = `https://www.twitch.tv/embed/${encodeURIComponent(channel)}/chat?parent=${encodeURIComponent(location.hostname)}&darkpopout`
  document.body.classList.toggle('chat', on)
  show(on ? 'Chat on' : 'Chat off', 1200)
}

function togglePause() {
  if (player.isPaused()) { player.play(); show('Playing', 1200) }
  else { player.pause(); show('Paused', 1200) }
}

document.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.altKey || event.metaKey) return
  const key = event.key
  const handled = ['Escape', 'q', ' ', 'MediaPlayPause', '9', '0', 'm', 'i',
    'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'n', 'c', 't'].includes(key)
  if (!handled) return
  event.preventDefault()
  if (key === 'Escape' || key === 'q') finish('quit')
  else if (key === ' ' || key === 'MediaPlayPause') ready && togglePause()
  else if (key === '9') run(['add', 'volume', -5])
  else if (key === '0') run(['add', 'volume', 5])
  else if (key === 'm') run(['cycle', 'mute'])
  else if (key === 'ArrowLeft') run(['seek', -10])
  else if (key === 'ArrowRight') run(['seek', 10])
  else if (key === 'ArrowUp') run(['seek', 60])
  else if (key === 'ArrowDown') run(['seek', -60])
  else if (key === 't') toggleChat()
  else if (key === 'i') info(4000)
})

function info(ms) {
  if (kind === 'live') show(channel, ms, true)
  else if (kind === 'vod' && playing) show(`${label} · ${clock(player.getCurrentTime())} / ${clock(player.getDuration())}`, ms)
  else show(label, ms)
}

// A clip: Twitch's clip embed has no player API, so the page only knows it was loaded.
function startClip() {
  const frame = document.createElement('iframe')
  frame.allow = 'autoplay; fullscreen'
  frame.src = `https://clips.twitch.tv/embed?clip=${encodeURIComponent(clip)}&parent=${encodeURIComponent(location.hostname)}&autoplay=true&muted=false`
  frame.onload = () => {
    ready = false
    playing = true
    document.getElementById('wait').classList.add('off')
    show(label, 3000)
  }
  document.getElementById('player').appendChild(frame)
}

function start() {
  if (kind === 'clip') { startClip(); return }
  if (!channel && !video) { finish('error', { code: SCRIPT_FAILED }); return }
  player = new Twitch.Player('player', {
    ...(video ? { video: `v${video}`, time: startAt ? `${Math.floor(startAt / 3600)}h${Math.floor((startAt % 3600) / 60)}m${startAt % 60}s` : '0s' } : { channel }),
    // Twitch only embeds on the hosts it is told about: this page's own (127.0.0.1 or localhost).
    parent: [location.hostname],
    width: '100%',
    height: '100%',
    autoplay: true,
    muted: false,
  })
  player.addEventListener(Twitch.Player.READY, () => {
    ready = true
    player.setMuted(false)
    player.play()
  })
  player.addEventListener(Twitch.Player.PLAYING, () => {
    if (!playing) info(3000)
    playing = true
    document.getElementById('wait').classList.add('off')
  })
  // Autoplay can be refused; the first key press then starts it.
  player.addEventListener(Twitch.Player.PLAYBACK_BLOCKED, () => show('Press Space to play', 6000))
  player.addEventListener(Twitch.Player.OFFLINE, () => finish('error', { code: OFFLINE }))
  // A live channel that "ends" went offline; a broadcast that ends was watched to the end.
  player.addEventListener(Twitch.Player.ENDED, () => (kind === 'vod' ? finish('eof') : finish('error', { code: OFFLINE })))
}

setInterval(() => { if (!finished) void report() }, 500)
setInterval(() => window.focus(), 2000)
setInterval(tickReplay, 1000)
const script = document.createElement('script')
script.src = 'https://player.twitch.tv/js/embed/v1.js'
script.onload = start
script.onerror = () => finish('error', { code: SCRIPT_FAILED })
document.head.appendChild(script)
</script>
</body>
</html>
